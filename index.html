<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo Hot Wheels</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<script src="js/script.js"></script>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Catálogo Hot Wheels</h1>

        <nav>
            <a href="#inicio">Início</a>
            <a href="#catalogo">Catálogo</a>
        </nav>
    </header>


    <!-- Conteúdo principal -->
    <main>

        <!-- Início -->
        <section id="inicio">
            <h2>Hot Wheels</h2>

            <p>
                Explore alguns dos modelos da famosa Hot Wheels.
            </p>
        </section>


        <!-- Catálogo -->
        <section id="catalogo">

            <h2>Catálogo</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Hot Wheels..."
            >

            <div class="lista-carros">

                <!-- Twin Mill -->
                <article class="carro">
                    <a href="https://hotwheels.fandom.com/wiki/Twin_Mill" target="_blank">
                        <img
                        src="images/twin_mill.jpg"
                        alt="Hot Wheels Twin Mill"
                    >
                    </a>
                    

                    <h3>Twin Mill</h3>
                </article>


                <!-- Deora II -->
                <article class="carro">
                    <a href="https://hotwheels.fandom.com/wiki/Deora_II" target="_blank">
                        <img
                            src="images/deora_ii.jpg"
                            alt="Hot Wheels Deora II"
                        >
                    </a>

                    <h3>Deora II</h3>
                </article>


                <!-- Muscle and Blown -->
                <article class="carro">
                    <a href="https://hotwheels.fandom.com/wiki/Muscle_and_Blown" target="_blank">
                        <img
                            src="images/muscle_and_blown.jpg"
                            alt="Hot Wheels Muscle and Blown"
                        >
                    </a>

                    <h3>Muscle and Blown</h3>
                </article>


                <!-- Bone Shaker -->
                <article class="carro">
                    <a href="https://hotwheels.fandom.com/wiki/Bone_Shaker" target="_blank">
                        <img
                            src="images/bone_shaker.jpg"
                            alt="Hot Wheels Bone Shaker"
                        >
                    </a>
                    
                    <h3>Bone Shaker</h3>
                </article>


                <!-- GT-Scorcher -->
                <article class="carro">
                    <a href="https://hotwheels.fandom.com/wiki/GT-Scorcher" target="_blank">
                        <img
                            src="images/gt_scorcher.jpg"
                            alt="Hot Wheels GT-Scorcher"
                        >
                    </a>

                    <h3>GT-Scorcher</h3>
                </article>

            </div>

        </section>

    </main>


    <!-- Rodapé -->
    <footer>
        <p>
            Projeto desenvolvido com HTML, CSS e JavaScript.
        </p>
    </footer>


    <script src="js/script.js"></script>

</body>

</html>
